# Keyless assembled-app coverage for probabilistic Shadow analysis. The
# headless marker makes the direct test driver expose the same maintenance
# capability as the product one-shot profile, so process exit must wait for the
# fresh child, report batch, durable relay, and root follow-up.

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              paceMs: 5
          - id: shadow-mind-runtime
            name: '@deepseek-ai/dsh-shadow-mind-runtime'
            config:
              heartbeatProbability: 1
              maxParallelShadows: 3
              resultBatchWindowMs: 4000
              defaultShadowTimeoutSeconds: 5
              headlessDrainTimeoutSeconds: 15
              conflictSynthesisEnabled: true
              conflictSynthesisTimeoutSeconds: 5
          - id: commands
            name: '@deepseek-ai/dsh-commands'
          - id: tool-shadow-mind
            name: '@deepseek-ai/dsh-tool-shadow-mind'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: shadow-mind-headless-marker
  name: './tests/fixtures/shadow-mind-headless-marker.ts'
